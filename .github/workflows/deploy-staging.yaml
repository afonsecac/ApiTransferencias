name: Deploy Staging

# Un push a `staging` (la rama protegida a la que se promueve desde `develop`) crea el
# release candidate (tag vX.Y.Z-rc.N y pre-release de GitHub) y lo despliega en staging.
# Fusionar en `develop` o en `master` NO despliega nada: develop solo integra y master
# solo recibe lo ya probado en staging; producción se despliega con el release
# (ver release.yaml y deploy-prod.yaml).
on:
  push:
    branches: [staging]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: write
  statuses: write

jobs:
  release-candidate:
    name: Create release candidate
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.rc.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Versionado semver a partir de Conventional Commits desde el último release
      # ESTABLE (los tags -rc.N no cuentan como base): BREAKING CHANGE / "!" => major,
      # "feat:" => minor, resto => patch. El candidato es la versión que saldría si se
      # publicara ahora, con un sufijo -rc.N que sube con cada push a staging.
      - name: Compute release candidate
        id: rc
        run: |
          set -euo pipefail

          LAST_TAG=$(git tag --list 'v*' --sort=-v:refname | grep -Ev -- '-' | head -n1 || true)
          if [ -z "$LAST_TAG" ]; then
            echo "No hay tags estables previos (v*). Sembrar un tag inicial (ej. v1.0.0) antes de que este workflow pueda calcular versiones." >&2
            exit 1
          fi

          COMMITS="$(git log "${LAST_TAG}..HEAD" --pretty=format:%s)"
          if [ -z "$COMMITS" ]; then
            echo "Sin commits nuevos desde $LAST_TAG: no se crea release candidate, solo se despliega."
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BUMP="patch"
          if echo "$COMMITS" | grep -qE '^[a-zA-Z]+(\([^)]*\))?!:|BREAKING CHANGE'; then
            BUMP="major"
          elif echo "$COMMITS" | grep -qE '^feat(\([^)]*\))?:'; then
            BUMP="minor"
          fi

          VERSION="${LAST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          BASE="v${MAJOR}.${MINOR}.${PATCH}"
          N=$(( $(git tag --list "${BASE}-rc.*" | wc -l) + 1 ))
          TAG="${BASE}-rc.${N}"
          echo "Bump: $BUMP -> $TAG (desde $LAST_TAG)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "last_tag=$LAST_TAG" >> "$GITHUB_OUTPUT"

      - name: Create tag and pre-release
        if: steps.rc.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.rc.outputs.tag }}" "${{ github.sha }}"
          git push origin "${{ steps.rc.outputs.tag }}"

          gh release create "${{ steps.rc.outputs.tag }}" \
            --title "${{ steps.rc.outputs.tag }}" \
            --target "${{ github.sha }}" \
            --prerelease \
            --notes-start-tag "${{ steps.rc.outputs.last_tag }}" \
            --generate-notes

  deploy:
    name: Deploy to Staging VPS
    needs: release-candidate
    # Runner self-hosted en el propio VPS de staging: Hostinger bloquea a nivel
    # de red las conexiones entrantes desde los runners de GitHub-hosted
    # (rangos de IP de Azure), así que appleboy/ssh-action nunca podía
    # conectar (i/o timeout, ni siquiera llegaba a sshd). El runner corre
    # localmente y hace la conexión saliente hacia GitHub, que sí funciona.
    runs-on: [self-hosted, staging]
    environment: staging

    steps:
      # /opt/api-transferencias no es un checkout git (se provisionó por rsync
      # para no arrastrar el historial completo al VPS) y el runner self-hosted
      # no tiene credenciales propias hacia GitHub. actions/checkout resuelve
      # esto con el token efímero del job, sin necesitar una deploy key nueva.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        run: |
          set -e
          cd /opt/api-transferencias

          echo "=== Creating pre-deploy backup ==="
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          mkdir -p backups/staging
          docker compose -f docker-compose.vps.yaml -f docker-compose.vps.staging.yaml \
            --env-file .env.vps exec -T database \
            pg_dump -U $(grep ^POSTGRES_USER .env.vps | cut -d= -f2) \
            $(grep ^POSTGRES_DB .env.vps | cut -d= -f2) \
            | gzip > "backups/staging/db_${TIMESTAMP}.sql.gz"
          echo "Backup: backups/staging/db_${TIMESTAMP}.sql.gz"
          # Retain last 7 backups
          ls -t backups/staging/db_*.sql.gz 2>/dev/null | tail -n +8 | xargs -r rm

          echo "=== Syncing latest changes ==="
          # Sincroniza el checkout (hecho por actions/checkout en el workspace
          # del job) hacia el directorio real de deploy, preservando lo que no
          # viene del repo: el .env.vps con los secretos y los backups locales.
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.env.vps' \
            --exclude='backups' \
            "${{ github.workspace }}/" ./

          echo "=== Building images ==="
          docker compose -f docker-compose.vps.yaml -f docker-compose.vps.staging.yaml \
            --env-file .env.vps build

          echo "=== Deploying ==="
          docker compose -f docker-compose.vps.yaml -f docker-compose.vps.staging.yaml \
            --env-file .env.vps up -d --remove-orphans --force-recreate

          echo "=== Running migrations ==="
          docker compose -f docker-compose.vps.yaml -f docker-compose.vps.staging.yaml \
            --env-file .env.vps exec -T php-fpm php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration

          # SIN cache:clear a propósito: la imagen ya trae var/cache/prod
          # horneado y el contenedor recién recreado arranca con caché fresca.
          # Ver el comentario equivalente en deploy-prod.yaml (allí el paso
          # abortaba el deploy por una carrera con el tráfico en vivo).

          echo "=== Cleanup ==="
          docker image prune -f

          echo "=== Health check ==="
          sleep 5
          # nginx no publica el puerto 80 al host: solo Traefik lo hace, y
          # enruta por Host header. Sin el dominio real, esto pega contra
          # Traefik sin matchear ninguna regla (404), nunca contra la app.
          curl -sf https://staging-api.comremit.com/health/ready || exit 1

          echo "=== Deploy complete ==="

      - name: Notify deployment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}' === 'success' ? '✅' : '❌';
            const sha = context.sha.substring(0, 7);
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: '${{ job.status }}' === 'success' ? 'success' : 'failure',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: `${status} Staging deploy ${'${{ needs.release-candidate.outputs.tag }}' || sha}`,
              context: 'deploy/staging'
            });
