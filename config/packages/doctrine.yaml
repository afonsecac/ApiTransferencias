doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '15'

        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App
            # ADR-001: el contexto Organización (COMR-270).
            MarketOrganizacion:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Market/Organizacion/Domain'
                prefix: 'App\Market\Organizacion\Domain'
            # ADR-001: el contexto Catálogo (COMR-103).
            MarketCatalogo:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Market/Catalogo/Domain'
                prefix: 'App\Market\Catalogo\Domain'
            # ADR-001: el contexto Geografía (COMR-286).
            MarketGeografia:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Market/Geografia/Domain'
                prefix: 'App\Market\Geografia\Domain'
            # ADR-001: el contexto Inventario (COMR-285).
            MarketInventario:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Market/Inventario/Domain'
                prefix: 'App\Market\Inventario\Domain'

# Entidades de los contextos nuevos (ADR-001): viven en Domain con atributos de Doctrine\ORM\Mapping.
# Cada contexto registra aquí su carpeta Domain (en la clave `mappings` de arriba), por ejemplo:
#
#   Catalogo:   (ya registrado arriba como MarketCatalogo)
when@test:
    doctrine:
        orm:
            mappings:
                EjemploPedido:
                    type: attribute
                    is_bundle: false
                    dir: '%kernel.project_dir%/tests/Examples/Pedido/Domain'
                    prefix: 'App\Tests\Examples\Pedido\Domain'
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
