monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
        - etecsa
        - dtone
        - csq
        - provider
        - client_request

    handlers:
        # Respaldo de POST de recargas/ventas: request.{env}.{YYYY-MM-DD}.log,
        # canal propio: "request" es el canal interno de Symfony ("Matched route"...).
        # rotación diaria y se conservan 15 ficheros (ver services.yaml).
        request_log:
            type: service
            id: app.monolog.request_log_handler
            channels: [client_request]

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                level: error
                channels: ["!client_request"]
                path: '%kernel.logs_dir%/debug.%kernel.environment%.log'
                max_files: 10
            # uncomment to get logging in your browser
            # you may have to allow bigger header sizes in your Web server configuration
            #firephp:
            #    type: firephp
            #    level: info
            #chromephp:
            #    type: chromephp
            #    level: info
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]
            streamed:
                type: stream
                path: '%kernel.logs_dir%/debug.%kernel.environment%.log'
                level: debug
                max_files: 10
                channels: ["!client_request"]
            etecsa_log:
                type: stream
                path: '%kernel.logs_dir%/etecsa.log'
                level: debug
                channels: [ etecsa ]
            dtone_log:
                type: stream
                path: '%kernel.logs_dir%/dtone.log'
                level: debug
                channels: [ dtone ]
            csq_log:
                type: stream
                path: '%kernel.logs_dir%/csq.log'
                level: debug
                channels: [ csq ]
            provider_log:
                type: stream
                path: '%kernel.logs_dir%/provider.log'
                level: debug
                channels: [ provider ]


when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: grouped
                max_files: 10
                channels: ["!console", "!client_request"]
            security:
                type: stream
                path: "%kernel.logs_dir%/security.%kernel.environment%.log"
                level: debug
                channels: [ "security" ]
                max_files: 10
            file_log:
                type: stream
                path: "%kernel.logs_dir%/info.%kernel.environment%.log"
                max_files: 10
                level: info
                channels: ["!client_request"]
            etecsa_log:
                type: stream
                path: '%kernel.logs_dir%/etecsa.log'
                level: info
                channels: [ etecsa ]
            dtone_log:
                type: stream
                path: '%kernel.logs_dir%/dtone.log'
                level: info
                channels: [ dtone ]
            csq_log:
                type: stream
                path: '%kernel.logs_dir%/csq.log'
                level: info
                channels: [ csq ]
            provider_log:
                type: stream
                path: '%kernel.logs_dir%/provider.log'
                level: info
                channels: [ provider ]
            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json
                channels: ["!client_request"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
            grouped:
                type: group
                members: [ streamed, deduplicated_http, deduplicated_critical ]
            streamed:
                type: stream
                path: '%kernel.logs_dir%/debug.%kernel.environment%.log'
                level: debug
                max_files: 10
            deduplicated_http:
                type: deduplication
                handler: symfony_mailer
                store: '%kernel.logs_dir%/monolog_dedup_http.log'
                time: 86400
                channels: ["!console"]
            symfony_mailer:
                type: symfony_mailer
                from_email: '%env(APP_MAILER_FROM)%'
                to_email:
                    - aportela7@gmail.com
                    - alexander.afonsecac@gmail.com
                subject: 'An Error Occurred in Api Clients! - ENV %kernel.environment%'
                level: error
                formatter: monolog.formatter.html
                content_type: text/html
                channels: ["!console"]
            deduplicated_critical:
                type: deduplication
                handler: symfony_mailer_critical
                store: '%kernel.logs_dir%/monolog_dedup_critical.log'
                time: 3600
                channels: ["!console"]
            symfony_mailer_critical:
                type: symfony_mailer
                from_email: '%env(APP_MAILER_FROM)%'
                to_email:
                    - aportela7@gmail.com
                    - alexander.afonsecac@gmail.com
                subject: 'An Critical Error Occurred in Api Clients! - ENV %kernel.environment%'
                level: critical
                formatter: monolog.formatter.html
                content_type: text/html
                channels: ["!console"]
