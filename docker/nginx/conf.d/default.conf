server {
    listen 80;
    server_name _;
    root /var/www/public;

    # Security headers (pentest 2026-10-09, hallazgos 4 y 5).
    # X-XSS-Protection: quitada — obsoleta, los navegadores modernos la
    # ignoran y Chrome llegó a desaconsejarla por poder introducir XSS
    # propios en sitios que la activaban mal.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS: Traefik termina TLS delante de este contenedor, pero el header
    # lo tiene que mandar la app — Traefik no lo añade por defecto.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # API JSON pura, sin HTML servido al navegador: "default-src 'none'" es
    # correcto y no rompe nada (frame-ancestors duplica X-Frame-Options para
    # navegadores que ya no miran la cabecera vieja).
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;

    # Stream SSE de notificaciones: pool PHP-FPM dedicado (ver
    # docker/php-fpm/stream.conf) para que las conexiones largas (hasta
    # streamTtl segundos) no agoten los workers del pool [www] que sirve el
    # resto de la API. access_log off porque la query string lleva el ticket
    # de un solo uso. fastcgi_buffering off + gzip off para que los eventos
    # lleguen al cliente al vuelo, no cuando nginx llene su buffer.
    location = /dashboard/api/notifications/stream {
        access_log off;
        fastcgi_pass php-fpm:9001;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_buffering off;
        fastcgi_read_timeout 300s;
        gzip off;
    }

    # Webhook de DTOne: el token de un solo uso va en la propia ruta
    # (/api/webhooks/dtone/{token}, ver DTOneWebhookController), así que
    # access_log off evita que quede en texto plano en los logs de acceso
    # (pentest 2026-10-09, hallazgo de severidad media).
    location ~ ^/api/webhooks/dtone/ {
        access_log off;
        try_files $uri /index.php$is_args$args;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php-fpm:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
        fastcgi_busy_buffers_size 32k;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    location /nginx-health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
